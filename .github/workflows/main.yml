# This is a basic GitHub Actions workflow to compile your C++ code.
# It will be triggered on every push to your main branch.

name: C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile all C++ files
      run: |
        # This script finds every .cpp file and compiles it.
        find . -type f -name "*.cpp" | while read -r file; do
          echo "Compiling $file..."
          g++ -std=c++17 -Wall "$file" -o "${file%.cpp}.out"
        done
        echo "All files compiled successfully."