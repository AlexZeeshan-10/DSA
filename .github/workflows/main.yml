# This is a basic GitHub Actions workflow to compile your C++ code.
# It will be triggered on every push to your main branch.

name: C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile all C++ files
      # This command finds all .cpp files and uses xargs to pass them to g++.
      # The -P 0 flag tells xargs to run as many parallel processes as possible,
      # dramatically speeding up compilation time.
      run: |
        find . -name "*.cpp" -print0 | xargs -0 -n 1 -P 0 -I {} g++ -std=c++17 -Wall -c {} -o {}.o
        echo "All files compiled successfully."